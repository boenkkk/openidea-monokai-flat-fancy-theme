id = "boenkkk.monokai-flat-fancy"
name = "Monokai Flat Fancy Theme"
version = "1.0.0"
description = "Monokai Flat Fancy themes: Default, Darker and Light — Monokai's syntax on a flatter, more minimal workbench."
authors = ["Budi Santoso"]
homepage = "https://github.com/boenkkk/openidea-monokai-flat-fancy-theme"
categories = ["themes"]
license = "MIT"
icon = "icons/monokai-flat-fancy.svg"
change-notes = "1.0.0 — first stable release: Default, Darker and Light, each a UI theme and an editor colour scheme covering all 252 themeable tokens, plus a plugin icon (vector redraw of the extension icon)."
# `icon` needs plugin API 1.2 or newer.
engines.openidea = "^1.2"

# Apply one in Settings › Plugins › Monokai Flat Fancy Theme. The colours are
# generated by generate.py from the Monokai Flat Fancy palette (not part of the package).
[[contributes.themes]]
path = "themes/default.theme.json"
editor-scheme = "themes/default.scheme.json"

[[contributes.themes]]
path = "themes/darker.theme.json"
editor-scheme = "themes/darker.scheme.json"

[[contributes.themes]]
path = "themes/light.theme.json"
editor-scheme = "themes/light.scheme.json"
